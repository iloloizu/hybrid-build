<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: track-meet scoreboard. Phase bib + week rail, 7 lane day strip, giant session name, then exercise cards with per-set logging. Exercise screen: clip, two stills, how-to. */
  --bg: #0b0b0c;
  --card: #151517;
  --card-2: #1e1e21;
  --ink: #f3efe6;
  --muted: #8b877e;
  --line: #29292c;
  --accent: #ff5b1f;
  --done: #c8f031;
  --run: #4cc9f0;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 600px; margin: 0 auto; padding: 14px 14px 64px; display: grid; gap: 16px; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; font-family: var(--display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }

/* header */
.brand { display: flex; justify-content: space-between; align-items: center; }
.mark { font: 400 15px var(--display); letter-spacing: .14em; }
.mark b { color: var(--accent); font-weight: 400; }
.bib { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 4px 9px 4px 6px; font: 800 11px var(--body); letter-spacing: .08em; text-transform: uppercase; }
.bib i { font: 400 15px var(--display); font-style: normal; background: var(--accent); color: var(--bg); border-radius: 3px; padding: 0 5px; letter-spacing: .02em; }

/* week rail */
.weeks { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.wk { border: 0; background: var(--card); border-radius: 6px; padding: 7px 0 6px; cursor: pointer; display: grid; justify-items: center; gap: 2px; }
.wk span { font: 400 17px var(--display); line-height: 1; color: var(--muted); }
.wk em { width: 14px; height: 3px; border-radius: 2px; background: var(--line); }
.wk.cut em { background: var(--run); }
.wk.test em { background: var(--done); }
.wk[aria-pressed="true"] { background: var(--accent); }
.wk[aria-pressed="true"] span { color: var(--bg); }
.wk[aria-pressed="true"] em { background: var(--bg); }
.phase { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); }
.phase b { font: 400 22px var(--display); color: var(--ink); letter-spacing: .02em; }

/* lanes */
.lanes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.lane { border: 0; border-left: 1px solid var(--line); background: var(--card); padding: 8px 0 0; cursor: pointer; display: grid; justify-items: center; gap: 1px; position: relative; }
.lane:first-child { border-left: 0; }
.lane .dow { font: 800 10px var(--body); letter-spacing: .1em; color: var(--muted); }
.lane .ln { font: 400 24px var(--display); line-height: 1.05; }
.lane .tag { font: 700 9.5px var(--body); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.lane .fill { width: 100%; height: 4px; background: var(--line); margin-top: 6px; }
.lane .fill i { display: block; height: 100%; background: var(--done); }
.lane.run .ln { color: var(--run); }
.lane[aria-selected="true"] { background: var(--ink); }
.lane[aria-selected="true"] .dow, .lane[aria-selected="true"] .tag { color: #55524b; }
.lane[aria-selected="true"] .ln { color: var(--bg); }

/* session hero */
.hero { display: grid; gap: 8px; padding: 4px 2px 2px; }
.hero h2 { font-size: clamp(40px, 12vw, 58px); line-height: .92; color: var(--accent); }
.hero h2.run { color: var(--run); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.meta span { font: 700 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 10px; }
.meta span.hot { border-color: var(--accent); color: var(--accent); }
.meta span.flag { border-color: var(--done); color: var(--done); }

/* section labels */
.lbl { display: flex; justify-content: space-between; align-items: baseline; font: 800 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lbl em { font-style: normal; color: var(--ink); letter-spacing: .04em; }

/* warm-up strip */
.warm { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.warm::-webkit-scrollbar { display: none; }
.wcard { flex: 0 0 104px; background: var(--card); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; display: grid; }
.wcard.on { border-color: var(--done); }
.wcard .thumb { width: 100%; height: auto; aspect-ratio: 1; border-radius: 0; border: 0; padding: 0; cursor: pointer; background: #000; }
.wcard .wb { display: grid; grid-template-columns: 1fr 30px; align-items: center; padding: 6px 6px 7px 8px; gap: 4px; }
.wcard .wn { font: 700 11.5px var(--body); line-height: 1.15; }
.wcard .wd { font: 400 14px var(--display); color: var(--muted); letter-spacing: .02em; }

/* exercise cards */
.list { display: grid; gap: 10px; }
.ss { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); border-left: 4px solid var(--accent); }
.ss-tag { font: 800 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); padding: 8px 12px 0; background: var(--card); }
.ss .ex { border: 0; border-radius: 0; }
.ss .ex + .ex { border-top: 1px solid var(--line); }
.ex { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 12px; display: grid; gap: 10px; }
.ex.done { border-color: var(--done); }
.ss .ex.done { box-shadow: inset 3px 0 0 var(--done); }
.exhead { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; background: none; border: 0; text-align: left; padding: 0; cursor: pointer; width: 100%; }
.thumb { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; background: #000; display: block; border: 1px solid var(--line); }
.thumb svg { display: block; width: 100%; height: 100%; }
.exname { font: 700 15px var(--body); line-height: 1.2; display: block; }
.exsub { font: 600 11.5px var(--body); color: var(--muted); display: block; margin-top: 2px; letter-spacing: .02em; }
.exsub .p { color: var(--accent); }
.dose { font: 400 26px var(--display); letter-spacing: .02em; text-align: right; line-height: 1; }
.dose small { display: block; font: 700 9.5px var(--body); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 1fr 42px; gap: 6px; align-items: center; }
.set .n { font: 400 18px var(--display); color: var(--muted); text-align: center; }
.field { display: flex; align-items: center; gap: 4px; background: var(--card-2); border: 1px solid transparent; border-radius: 9px; padding: 0 10px; height: 40px; }
.field input { width: 100%; min-width: 0; background: transparent; border: 0; color: var(--ink); font: 700 16px var(--body); font-variant-numeric: tabular-nums; outline: none; }
.field input::placeholder { color: #57544e; }
.field span { color: var(--muted); font: 700 10px var(--body); letter-spacing: .06em; text-transform: uppercase; }
.field:focus-within { border-color: var(--accent); }
.chk { width: 42px; height: 40px; border-radius: 9px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; padding: 0; display: grid; place-items: center; }
.chk svg { width: 18px; height: 18px; stroke: var(--line); }
.chk[aria-pressed="true"] { background: var(--done); border-color: var(--done); }
.chk[aria-pressed="true"] svg { stroke: var(--bg); }
.set.is-done .field { background: #23261a; }
.wb .chk { width: 30px; height: 30px; border-radius: 8px; }
.wb .chk svg { width: 14px; height: 14px; }

.longrun { background: var(--card); border-radius: 14px; padding: 18px 16px; border-left: 4px solid var(--run); color: var(--muted); }

/* swaps */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: 700 12.5px var(--body); border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 12px; cursor: pointer; }
.chips button b { font: 400 14px var(--display); color: var(--accent); margin-right: 4px; letter-spacing: .02em; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.swapbox { background: var(--card); border-radius: 12px; padding: 12px 14px; }
.swapbox ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.textbtn { justify-self: start; font: 600 12px var(--body); background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }

/* exercise screen */
.back { justify-self: start; background: none; border: 0; color: var(--muted); font: 800 11px var(--body); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; padding: 4px 0; }
.back b { color: var(--accent); font-size: 14px; }
.dtitle h2 { font-size: clamp(34px, 10vw, 48px); line-height: .95; }
.mus { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mus span { font: 700 11px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.mus span.hl { border-color: var(--accent); color: var(--accent); }
.player { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.player svg { display: block; width: 100%; height: auto; aspect-ratio: 1; max-height: 400px; }
.pbar { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; background: var(--card); }
.pbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); cursor: pointer; display: grid; place-items: center; }
.pbtn svg { width: 14px; height: 14px; fill: var(--bg); }
.track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); }
.time { font: 400 15px var(--display); color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.stills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.still { margin: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.still svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
.still figcaption { font: 400 15px var(--display); letter-spacing: .06em; padding: 6px 10px; background: var(--card); }
.still figcaption b { color: var(--accent); font-weight: 400; margin-right: 6px; }
.howto { background: var(--card); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.howto ol, .howto ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14.5px; }
.howto.warn { box-shadow: inset 4px 0 0 var(--accent); }
.equip { font-size: 13px; color: var(--muted); }

@media (max-width: 420px) {
  .lane .ln { font-size: 20px; }
  .lane .tag { font-size: 8.5px; }
  .wk span { font-size: 15px; }
}

/* v4 additions */
.thumb img, .still img { display: block; width: 100%; height: 100%; object-fit: cover; }
.still img { aspect-ratio: 1; height: auto; }
.lane.off .tag { color: #5d5a54; }
.lane.off .ln { color: var(--muted); }
.lane .ran { position: absolute; top: 5px; right: 5px; color: var(--run); line-height: 0; }
.warnline { font-size: 12.5px; color: var(--done); border-left: 3px solid var(--done); padding: 4px 10px; }
.toast { font: 700 13px var(--body); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 9px 12px; }
.hero h2.dim { color: var(--muted); }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.actions button { font: 800 11px var(--body); letter-spacing: .08em; text-transform: uppercase; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; cursor: pointer; }
.actions button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.sheet { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.sheet .note { font-size: 13.5px; color: var(--muted); }
.strava { background: var(--card); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; border-left: 4px solid var(--run); }
.strava .lbl em { color: var(--muted); font-weight: 600; }
.act { display: grid; gap: 1px; }
.aname { font: 700 14px var(--body); }
.astat { font: 400 16px var(--display); letter-spacing: .03em; color: var(--run); }
.foot { display: flex; gap: 16px; flex-wrap: wrap; }
.modes { display: inline-flex; gap: 4px; background: var(--card); border-radius: 99px; padding: 3px; justify-self: start; }
.modes button { border: 0; background: none; font: 800 11px var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; border-radius: 99px; cursor: pointer; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.pstage { position: relative; aspect-ratio: 3 / 2; background: #000; }
.pstage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.pstage #p1 { opacity: 0; }
.bmap svg { display: block; width: 100%; max-width: 360px; margin: 0 auto; height: auto; }
.equip a { color: var(--muted); }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
/* ---------- figure engine: original stick-figure illustrations ---------- */
const LEN = { torso: 50, head: 13, th: 42, sh: 40, ua: 30, fa: 28, foot: 13 };
const rad = d => d * Math.PI / 180;
const dirC = deg => [Math.sin(rad(deg)), -Math.cos(rad(deg))]; // compass: 0 up, 90 right, 180 down
const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k];
function ik(A, C, l1, l2, s) {
  let dx = C[0] - A[0], dy = C[1] - A[1];
  let d = Math.hypot(dx, dy);
  const dd = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
  const phi = Math.atan2(dy, dx);
  const a = Math.acos((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd));
  const ang = phi + s * a;
  const J = [A[0] + l1 * Math.cos(ang), A[1] + l1 * Math.sin(ang)];
  const ex = C[0] - J[0], ey = C[1] - J[1], el = Math.hypot(ex, ey) || 1;
  return [J, [J[0] + ex / el * l2, J[1] + ey / el * l2]];
}
const SIDE = { hip: [92, 104], t: 0, an: [93, 186], an2: [89, 186], ha: [96, 112], ha2: [92, 112], kb: -1, kb2: -1, eb: 1, eb2: 1, ft: 90, ft2: 90 };
const FRONT = { hip: [100, 104], haL: [80, 112], haR: [120, 112], anL: [90, 186], anR: [110, 186], ebL: 1, ebR: -1, kbL: 1, kbR: -1 };
function solve(p0) {
  const J = {};
  if (p0.v === "front") {
    const p = Object.assign({}, FRONT, p0);
    J.hip = p.hip; J.neck = add(p.hip, [0, -50]); J.head = add(J.neck, [0, -13]);
    J.shL = add(J.neck, [-16, 4]); J.shR = add(J.neck, [16, 4]);
    J.hipL = add(p.hip, [-9, 0]); J.hipR = add(p.hip, [9, 0]);
    [["L"], ["R"]].forEach(([s]) => {
      if (p["el" + s]) { J["el" + s] = p["el" + s]; J["ha" + s] = p["ha" + s]; }
      else { const r = ik(J["sh" + s], p["ha" + s], LEN.ua, LEN.fa, p["eb" + s]); J["el" + s] = r[0]; J["ha" + s] = r[1]; }
      if (p["kn" + s]) { J["kn" + s] = p["kn" + s]; J["an" + s] = p["an" + s]; }
      else { const r = ik(J["hip" + s], p["an" + s], LEN.th, LEN.sh, p["kb" + s]); J["kn" + s] = r[0]; J["an" + s] = r[1]; }
      J["to" + s] = add(J["an" + s], [s === "L" ? -6 : 6, 1]);
    });
    return J;
  }
  const p = Object.assign({}, SIDE, p0);
  J.hip = p.hip; J.neck = add(p.hip, dirC(p.t), LEN.torso); J.head = add(J.neck, dirC(p.t + (p.ht || 0)), LEN.head);
  J.mid = add(p.hip, dirC(p.t), LEN.torso * 0.5);
  ["", "2"].forEach(s => {
    if (p["el" + s]) { J["el" + s] = p["el" + s]; J["ha" + s] = p["ha" + s]; }
    else { const r = ik(J.neck, p["ha" + s], LEN.ua, LEN.fa, p["eb" + s]); J["el" + s] = r[0]; J["ha" + s] = r[1]; }
    if (p["kn" + s]) { J["kn" + s] = p["kn" + s]; J["an" + s] = p["an" + s]; }
    else { const r = ik(J.hip, p["an" + s], LEN.th, LEN.sh, p["kb" + s]); J["kn" + s] = r[0]; J["an" + s] = r[1]; }
    J["to" + s] = add(J["an" + s], dirC(p["ft" + s]), LEN.foot);
  });
  return J;
}
function lerpJ(A, B, k) { const o = {}; for (const n in A) o[n] = B[n] ? [A[n][0] + (B[n][0] - A[n][0]) * k, A[n][1] + (B[n][1] - A[n][1]) * k] : A[n]; return o; }

const C = { body: "#6c6f78", far: "#3b3d43", hl: "#ff4b2b", hlFar: "#9a3a24", prop: "#8b877e", propFill: "#1e1e21", ground: "#29292c", cable: "#c8f031" };
C.prop = "#9a968c"; C.propFill = "#1b1b1e";
const ln = (a, b, col, w, extra = "") => `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
function drawProps(props, J, layer) {
  let s = "";
  (props || []).forEach(pr => {
    const dyn = !!pr.at;
    if ((layer === "back") === dyn) return;
    const P = pr.at ? add(J[pr.at] || [0, 0], pr.off || [0, 0]) : null;
    switch (pr.k) {
      case "rect": s += `<rect x="${pr.x}" y="${pr.y}" width="${pr.w}" height="${pr.h}" rx="${pr.r || 2}" fill="${C.propFill}" stroke="${C.prop}" stroke-width="1.5"/>`; break;
      case "poly": s += `<polygon points="${pr.pts.map(q => q.join(",")).join(" ")}" fill="${C.propFill}" stroke="${C.prop}" stroke-width="1.5"/>`; break;
      case "line": s += ln(pr.a, pr.b, C.prop, pr.w || 4); break;
      case "post": s += `<rect x="${pr.x - 4}" y="${pr.y1}" width="8" height="${pr.y2 - pr.y1}" fill="${C.propFill}" stroke="${C.prop}" stroke-width="1.5"/>`; break;
      case "cable": s += ln(pr.from, J[pr.to], C.cable, 1.6) + `<circle cx="${pr.from[0]}" cy="${pr.from[1]}" r="3.5" fill="${C.prop}"/>`; break;
      case "plate": s += `<circle cx="${P[0].toFixed(1)}" cy="${P[1].toFixed(1)}" r="${pr.r || 12}" fill="${C.propFill}" stroke="${C.prop}" stroke-width="3"/><circle cx="${P[0].toFixed(1)}" cy="${P[1].toFixed(1)}" r="2" fill="${C.prop}"/>`; break;
      case "db": s += `<rect x="${(P[0] - 8).toFixed(1)}" y="${(P[1] - 3).toFixed(1)}" width="16" height="6" rx="2" fill="${C.prop}"/><rect x="${(P[0] - 9).toFixed(1)}" y="${(P[1] - 6).toFixed(1)}" width="5" height="12" rx="1.5" fill="${C.prop}"/><rect x="${(P[0] + 4).toFixed(1)}" y="${(P[1] - 6).toFixed(1)}" width="5" height="12" rx="1.5" fill="${C.prop}"/>`; break;
      case "bar": s += ln(J[pr.at], J[pr.to], C.prop, 3.5); break;
      case "grip": s += `<circle cx="${P[0].toFixed(1)}" cy="${P[1].toFixed(1)}" r="4" fill="${C.prop}"/>`; break;
    }
  });
  return s;
}
function seg(a, b, w1, w2, col) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const p = (q, w, s) => `${(q[0] + nx * w / 2 * s).toFixed(1)},${(q[1] + ny * w / 2 * s).toFixed(1)}`;
  return `<path d="M${p(a, w1, 1)} L${p(b, w2, 1)} L${p(b, w2, -1)} L${p(a, w1, -1)} Z" fill="${col}"/><circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="${w1 / 2}" fill="${col}"/><circle cx="${b[0].toFixed(1)}" cy="${b[1].toFixed(1)}" r="${w2 / 2}" fill="${col}"/>`;
}
function figure(J, ex, opts = {}) {
  const hl = new Set(ex.hl || []);
  const B = C.body, F = C.far, H = C.hl;
  const col = id => hl.has(id) ? H : B;
  const fcol = id => hl.has(id) ? C.hlFar : F;
  let s = `<rect x="0" y="0" width="200" height="200" fill="#000"/>`;
  if (!opts.thumb) for (let g = 20; g < 200; g += 20) s += ln([g, 0], [g, 200], "#111113", 1) + ln([0, g], [200, g], "#111113", 1);
  s += ln([0, 188], [200, 188], C.ground, 3);
  s += drawProps(ex.props, J, "back");
  if (ex.v === "front") {
    const leg = S => seg(J["hip" + S], J["kn" + S], 15, 11, col("th" + S)) + seg(J["kn" + S], J["an" + S], 11, 7, col("sh" + S)) + seg(J["an" + S], J["to" + S], 6, 5, B);
    const arm = S => seg(J["sh" + S], J["el" + S], 11, 8.5, col("ua" + S)) + seg(J["el" + S], J["ha" + S], 8.5, 6, col("fa" + S));
    s += leg("L") + leg("R");
    const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const sL = add(J.shL, [-2, 0]), sR = add(J.shR, [2, 0]), hL = add(J.hipL, [-3, 0]), hR = add(J.hipR, [3, 0]);
    const mL = add(mid(sL, hL), [2, 0]), mR = add(mid(sR, hR), [-2, 0]);
    const poly = (pts, c) => `<polygon points="${pts.map(q => q.map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${c}" stroke="${c}" stroke-width="5" stroke-linejoin="round"/>`;
    s += poly([sL, sR, mR, mL], col("torsoU")) + poly([mL, mR, hR, hL], col("torsoL"));
    if (hl.has("lats")) s += poly([add(J.shL, [1, 6]), add(mL, [3, 4]), add(J.shL, [7, 10])], H) + poly([add(J.shR, [-1, 6]), add(mR, [-3, 4]), add(J.shR, [-7, 10])], H);
    s += seg(J.neck, J.head, 8, 8, B);
    s += arm("L") + arm("R");
    ["L", "R"].forEach(S => { if (hl.has("delt") || hl.has("delt" + S)) s += `<circle cx="${J["sh" + S][0]}" cy="${J["sh" + S][1]}" r="7.5" fill="${H}"/>`; });
  } else {
    s += seg(J.hip, J.kn2, 14, 10, fcol("th2")) + seg(J.kn2, J.an2, 10, 7, fcol("sh2")) + seg(J.an2, J.to2, 6, 5, F);
    s += seg(J.neck, J.el2, 10, 8, fcol("ua")) + seg(J.el2, J.ha2, 8, 6, fcol("fa"));
    s += seg(J.hip, J.mid, 21, 23, col("torsoL")) + seg(J.mid, J.neck, 23, 25, col("torsoU"));
    if (hl.has("lats")) { const off = dirC((ex._t || 0) - 90); s += seg(add(J.neck, off, 7), add(J.mid, off, 7), 9, 6, H); }
    s += seg(J.neck, J.head, 8, 8, B);
    s += seg(J.hip, J.kn, 15, 11, col("th")) + seg(J.kn, J.an, 11, 7, col("sh")) + seg(J.an, J.to, 6, 5, B);
    s += seg(J.neck, J.el, 11, 8.5, col("ua")) + seg(J.el, J.ha, 8.5, 6, col("fa"));
    if (hl.has("delt")) s += `<circle cx="${J.neck[0].toFixed(1)}" cy="${J.neck[1].toFixed(1)}" r="7.5" fill="${H}"/>`;
  }
  s += `<ellipse cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" rx="9" ry="10" fill="${B}"/>`;
  s += drawProps(ex.props, J, "front");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${ex.name}${opts.label ? ", " + opts.label : ""}">${s}</svg>`;
}

const MUSCLE_KEYS = [
  [/upper chest|chest/i, ["chest"]], [/front delt|side delt/i, ["delt"]], [/rear delt/i, ["reardelt"]], [/lower traps/i, ["traps"]],

  [/hamstring/i, ["hams"]], [/calves|soleus|achilles/i, ["calves"]], [/tibialis|shins/i, ["tib"]]

  const bx = 110;

    + `<polygon points="${165},28 ${179},38 ${165},60 ${151},38" fill="${c("traps")}"/>`
    + E(143, 41, 7, 7, "reardelt") + E(187, 41, 7, 7, "reardelt")

  return `<svg viewBox="0 0 220 196" role="img" aria-label="Muscles worked: ${list.join(", ")}">${front}${back}<text x="55" y="195" text-anchor="middle" fill="#6e6a62" font-size="8" font-family="Manrope, sans-serif" letter-spacing="1">FRONT</text><text x="165" y="195" text-anchor="middle" fill="#6e6a62" font-size="8" font-family="Manrope, sans-serif" letter-spacing="1">BACK</text></svg>`;

  on("[data-d]", b => { dayIdx = +b.dataset.d; swapOpen = null; actionMode = null; renderPlan(); });
  on("[data-sw]", b => { swapOpen = swapOpen === b.dataset.sw ? null : b.dataset.sw; keep(renderPlan); });
  on("[data-ex]", b => openEx(b.dataset.ex));
  on("[data-act]", b => { actionMode = actionMode === b.dataset.act ? null : b.dataset.act; keep(renderPlan); });
  on("[data-confirm]", b => { if (b.dataset.confirm === "push") toast = pushToTomorrow(week, dayIdx); else { skipDay(week, dayIdx); toast = "Skipped. The rest of the week stays put."; } actionMode = null; renderPlan(); });
  on("[data-swapwith]", b => { const to = +b.dataset.swapwith; swapDays(week, dayIdx, to); toast = `Swapped with ${DOW[to]}.`; actionMode = null; renderPlan(); });
  on("[data-warm]", b => { const k = warmKey(week, sess, +b.dataset.warm); sset(k, sget(k) ? null : 1); keep(renderPlan); });
  on("[data-done]", b => {
    const i = +b.dataset.i, s = +b.dataset.s, k = setKey(week, sess, i, s), v = Object.assign({}, sget(k) || {});
    if (!v.d) { if (!v.r) v.r = dose(DAYS[sess].items[i], week).r; v.d = 1; } else v.d = 0;
    sset(k, v); keep(renderPlan);
  });
  app.querySelectorAll("input[data-f]").forEach(inp => inp.onchange = () => {
    const i = +inp.dataset.i, s = +inp.dataset.s, f = inp.dataset.f, k = setKey(week, sess, i, s), v = Object.assign({}, sget(k) || {});
    v[f] = inp.value.trim(); sset(k, v);
    if (f === "w" && v.w) { const ds = dose(DAYS[sess].items[i], week); for (let t = s + 1; t < ds.s; t++) { const kk = setKey(week, sess, i, t), vv = Object.assign({}, sget(kk) || {}); if (!vv.w) { vv.w = v.w; sset(kk, vv); const el = app.querySelector(`input[data-i="${i}"][data-s="${t}"][data-f="w"]`); if (el) el.value = v.w; } } }
  });
  const c = document.getElementById("clearday");
  if (c) c.onclick = () => { const g = `w${week}s${sess}`; STORE[g] = {}; persistLocal(); dirty.add(g); flush(); renderPlan(); };
  const r = document.getElementById("resetweek");
  if (r) r.onclick = () => { sset(schedKey(week), null); toast = "Week reset to the original plan."; renderPlan(); };
}
const keep = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };

/* ---------- exercise view ---------- */
let raf = null, playing = true, t0 = 0, tPaused = 0, planScroll = 0, mode = "photo";
const CLIP = 10000, REP = 2500;
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
function phaseK(ms) { const p = ms % REP; if (p < 1000) return ease(p / 1000); if (p < 1300) return 1; if (p < 2300) return 1 - ease((p - 1300) / 1000); return 0; }
function openEx(id) { planScroll = window.scrollY; exId = id; view = "ex"; mode = "diagram"; renderEx(); window.scrollTo(0, 0); }
function closeEx() { cancelAnimationFrame(raf); view = "plan"; renderPlan(); window.scrollTo(0, planScroll); }
const PLAY = `<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z"/></svg>`, PAUSE = `<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1"/><rect x="8.3" y="1.5" width="3.2" height="11" rx="1"/></svg>`;
function renderEx() {
  const e = EX[exId], s = slots(week)[dayIdx];
  const JA = solve(Object.assign({ v: e.v }, e.A)), JB = solve(Object.assign({ v: e.v }, e.B));
  const ex = Object.assign({ _t: e.A.t }, e);
  const photo = e.photo && mode === "photo";
  const stage = photo ? `<div class="pstage"><img src="img/${e.photo}/0.jpg" alt="${esc(e.name)} start position"><img id="p1" src="img/${e.photo}/1.jpg" alt="${esc(e.name)} finish position"></div>` : `<div id="stage">${figure(JA, ex)}</div>`;
  const stills = photo
    ? `<figure class="still"><img src="img/${e.photo}/0.jpg" alt="Start"><figcaption><b>01</b>Start</figcaption></figure><figure class="still"><img src="img/${e.photo}/1.jpg" alt="Finish"><figcaption><b>02</b>Finish</figcaption></figure>`
    : `<figure class="still">${figure(JA, ex, { label: "start" })}<figcaption><b>01</b>Start</figcaption></figure><figure class="still">${figure(JB, Object.assign({}, ex, { _t: e.B.t }), { label: "finish" })}<figcaption><b>02</b>Finish</figcaption></figure>`;
  document.getElementById("app").innerHTML = `
    <button class="back" id="back"><b>‹</b> ${s >= 0 ? DAYS[s].name : "Back"}</button>
    <div class="dtitle"><h2>${e.name}</h2><div class="mus">${e.muscles.map((m, i) => `<span class="${i === 0 ? "hl" : ""}">${m}</span>`).join("")}</div></div>
    ${e.photo ? `<div class="modes"><button data-mode="diagram" aria-pressed="${mode === "diagram"}">Animation</button><button data-mode="photo" aria-pressed="${mode === "photo"}">Real photo</button></div>` : ""}
    <div class="player">${stage}<div class="pbar"><button class="pbtn" id="pp" aria-label="Pause">${PAUSE}</button><div class="track"><i id="prog"></i></div><span class="time" id="tm">0:00 / 0:10</span></div></div>
    <div class="stills">${stills}</div>
    <section class="howto"><div class="lbl">Muscles worked</div><div class="bmap">${bodyMap(e.muscles)}</div></section>
    <section class="howto"><div class="lbl">How to</div><ol>${e.steps.map(x => `<li>${x}</li>`).join("")}</ol></section>
    <section class="howto"><div class="lbl">Cues</div><ul>${e.cues.map(x => `<li>${x}</li>`).join("")}</ul></section>
    <section class="howto warn"><div class="lbl">Don't</div><div style="font-size:14.5px">${e.mistake}</div></section>
    <div class="equip">Equipment: ${e.equip}${e.photo ? ` · Photos: <a href="https://github.com/yuhonas/free-exercise-db">Free Exercise DB</a> (public domain)` : ""}</div>`;
  document.getElementById("back").onclick = closeEx;
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; cancelAnimationFrame(raf); renderEx(); });
  const st = document.getElementById("stage"), p1 = document.getElementById("p1"), prog = document.getElementById("prog"), tm = document.getElementById("tm"), pp = document.getElementById("pp");
  playing = !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); tPaused = 0; t0 = performance.now();
  const setBtn = () => { pp.innerHTML = playing ? PAUSE : PLAY; pp.setAttribute("aria-label", playing ? "Pause" : "Play"); };
  setBtn();
  const frame = now => {
    if (view !== "ex") return;
    const ms = playing ? (now - t0) % CLIP : tPaused;
    if (playing) tPaused = ms;
    const k = phaseK(ms);
    if (p1) p1.style.opacity = k; else if (st) st.innerHTML = figure(lerpJ(JA, JB, k), ex);
    prog.style.width = (ms / CLIP * 100) + "%";
    tm.textContent = `0:${String(Math.floor(ms / 1000)).padStart(2, "0")} / 0:10`;
    raf = requestAnimationFrame(frame);
  };
  pp.onclick = () => { playing = !playing; if (playing) t0 = performance.now() - tPaused; setBtn(); };
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}

/* ---------- connect: synced logs + Strava feed ---------- */
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) return;
    DB = db;
    const uid = user ? await user.id() : null;
    const safeRender = () => { if (view === "plan" && !(document.activeElement && document.activeElement.tagName === "INPUT")) keep(renderPlan); };
    db.collection("strava").orderBy("date", "desc").limit(400).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(doc => { const x = doc.data(); if (x && x.date) (m[x.date] = m[x.date] || []).push(x); });
      ACTS = m; safeRender();
    }, () => {});
    db.doc("meta/sync").onSnapshot(s => { const x = s.exists ? s.data() : null; SYNC = x && x.at ? new Date(x.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : null; safeRender(); }, () => {});
    if (uid) {
      UID = uid;
      db.collection("data/users/" + uid).onSnapshot(snap => {
        snap.docs.forEach(doc => { if (!dirty.has(doc.id)) { const x = doc.data(); if (x && x.v) STORE[doc.id] = Object.assign({}, x.v); } });
        persistLocal(); safeRender();
        Object.keys(STORE).forEach(k => { if (!snap.docs.some(d => d.id === k)) dirty.add(k); }); flush();
      }, () => {});
    }
  } catch (e) { /* offline: local copy keeps working */ }
}
/* ---------- pose check grid (dev only) ---------- */
if (location.hash === "#posegrid") {
  document.getElementById("app").style.maxWidth = "100%";
  document.getElementById("app").innerHTML = `<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">${Object.keys(EX).map(id => { const e = EX[id]; return `<div><div style="font-size:11px">${id}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px">${figure(solve(Object.assign({ v: e.v }, e.A)), Object.assign({ _t: e.A.t }, e))}${figure(solve(Object.assign({ v: e.v }, e.B)), Object.assign({ _t: e.B.t }, e))}</div></div>`; }).join("")}</div>`;
} else { renderPlan(); connect(); }
</script>
