<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting Strava</title>
<meta name="referrer" content="no-referrer">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#b3b3b3;font:600 16px system-ui,sans-serif}</style></head>
<body><p>Connecting Strava…</p>
<script>
// Strava returns here (callback domain iloloizu.github.io). Hand the one-time code to the server,
// which swaps it for tokens with the secret and sends the browser back to the app.
var q = new URLSearchParams(location.search), out = new URLSearchParams();
["code", "state", "scope", "error"].forEach(function (k) { var v = q.get(k); if (v && v.length < 600) out.set(k, v); });
location.replace("https://filqlpwpdfuzazpusgok.supabase.co/functions/v1/strava-callback?" + out.toString());
</script></body></html>
